services:
  app:
    build: .
    container_name: training-cockpit
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - cockpit-data:/data
    restart: always

  caddy:
    image: caddy:2
    depends_on: [app]
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  cockpit-data:
  caddy-data:
  caddy-config:
